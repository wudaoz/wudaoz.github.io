<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Weiheng Wu</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}" type="image/png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <script src="https://kit.fontawesome.com/a860a211d3.js" crossorigin="anonymous"></script>

  <!-- Theme CSS (shared with the homepage) + blog styles -->
  <link rel="stylesheet" href="{{ '/assets/css/theme-claude.css' | relative_url }}?v=20261121-blog">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}?v=20261122-figure">
</head>

<body class="theme-claude blog-page">

  <!-- Top Navigation Bar -->
  <nav class="top-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="{{ '/' | relative_url }}">Wu's Homepage</a>
      </div>
      <div class="nav-links" aria-label="Sections">
        <a href="{{ '/#about-me' | relative_url }}">About</a>
        <a href="{{ '/#news' | relative_url }}">News</a>
        <a href="{{ '/#publications' | relative_url }}">Publications</a>
        <a href="{{ '/#education-experience' | relative_url }}">Experience</a>
        <a href="{{ '/#services' | relative_url }}">Services</a>
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/blog/' | relative_url }}" class="active" aria-current="page">Blog</a>
      </div>
      <div class="nav-right">
        <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="blog-main">
{{ content }}
  </main>

  <div class="blog-footer">
    <p>&copy; 2026 Weiheng Wu. All rights reserved.</p>
  </div>

  <script>
    (function() {
      // Theme management (same behaviour and storage key as the homepage)
      var themeToggle = document.getElementById('themeToggle');
      var icon = themeToggle.querySelector('i');

      function setTheme(isDark) {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        if (isDark) {
          icon.classList.replace('fa-moon', 'fa-sun');
        } else {
          icon.classList.replace('fa-sun', 'fa-moon');
        }
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      }

      var savedTheme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));

      themeToggle.addEventListener('click', function() {
        setTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
      });

      // On narrow screens the nav links scroll sideways: bring "Blog" into view
      var navBox = document.querySelector('.nav-links');
      var active = navBox.querySelector('a.active');
      if (active && navBox.scrollWidth > navBox.clientWidth) {
        navBox.scrollLeft = navBox.scrollWidth;
      }
    })();
  </script>

</body>

</html>
